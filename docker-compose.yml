services:
  # 1. Database Service
  db:
    image: mysql:8.0
    container_name: lms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Main Backend Service
  lms-backend:
    build: .
    container_name: lms-backend
    user: root
    restart: always
    environment:
      - HOST_PROJECT_PATH=${PWD}
    depends_on:
      db:
        condition: service_healthy
    command: nodemon -L index.js
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./temp:/app/temp
    env_file:
      - .env

volumes:
  mysql_data:
